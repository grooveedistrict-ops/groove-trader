 if(a.r=='scout'){const cs=(x.candidates||[]).slice().sort((p,q)=>q.score-p.score);return `<div class="dp" style="grid-column:span 2"><h4>TOP OPPORTUNITIES · საუკეთესო</h4>${cs.slice(0,5).map((c,i)=>`<div class="drow"><span>${i+1}. <b>${E(c.name)}</b> <small>${E(c.type)}</small></span><b>${E(c.score)}</b></div><small>${E(c.why)}</small>`).join('')||'—'}</div><div class="dp"><h4>🔍 დასკანერებული</h4><div class="big">${E(x.scanned??'—')}</div><small>assets scanned</small><h4 style="margin-top:8px">◎ ნაპოვნი</h4><div class="big">${cs.length}</div><small>opportunities found</small></div>`}
 if(a.r=='charts')return (x.setups||[]).slice(0,3).map(s=>`<div class="dp"><h4>${E(s.candidate)} · ${E(s.trend)}</h4>${sparkSVG(s.prices,a.c)}<div class="drow"><span>entry</span><b>${E(s.entry)}</b></div><div class="drow"><span class="pos">TP</span><b>${E(s.tp)}</b></div><div class="drow"><span class="neg">stop</span><b>${E(s.stop)}</b></div>${s.volume?`<small>vol: ${E(s.volume)}</small>`:''}${s.support?`<small> S:${E(s.support)} R:${E(s.resistance)}</small>`:''}</div>`).join('')||WAIT();
 if(a.r=='news')return [['bullish','BULLISH · ზრდა','#39ff88'],['bearish','BEARISH · ვარდნა','#ff3b6b'],['watch','WATCH · ყურადღება','#f5ff3b']].map(([s,t,c])=>`<div class="dp"><h4 style="color:${c}">${t}</h4>${(x.items||[]).filter(i=>i.stance==s).slice(0,4).map(i=>`<div class="drow" style="display:block"><b>${E(i.candidate)}</b> ${E(i.text)} <small>— ${E(i.source)}</small></div>`).join('')||'<small>—</small>'}</div>`).join('');
 if(a.r=='sentiment'){const o=+x.overall,ang=isNaN(o)?0:o*90;return `<div class="dp"><h4>CROWD MOOD · X</h4><svg viewBox="0 0 120 70" width="100%" height="90"><path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="#333" stroke-width="10"/><path d="M10 60 A50 50 0 0 1 60 10" fill="none" stroke="#ff3b6b" stroke-width="10"/><path d="M60 10 A50 50 0 0 1 110 60" fill="none" stroke="#39ff88" stroke-width="10"/><line x1="60" y1="60" x2="60" y2="18" stroke="#fff" stroke-width="3" transform="rotate(${ang} 60 60)"/></svg><div class="big" style="text-align:center">${isNaN(o)?'—':o.toFixed(2)}</div></div><div class="dp" style="grid-column:span 2"><h4>კანდიდატები</h4>${(x.items||[]).map(i=>`<div class="drow"><span><b>${E(i.candidate)}</b> <small>${E(i.note)}</small></span><b class="${i.mood>=0?'pos':'neg'}">${(+i.mood).toFixed(2)}</b></div>`).join('')||'—'}</div>`}
 if(a.r=='skeptic'){const rv=x.reviews||[];return rv.slice(0,2).map(v=>`<div class="dp"><h4>${E(v.candidate)} · RISK CHECK</h4>${Object.entries(v.checks||{}).map(([k,b])=>`<div class="drow"><span>${k}</span>${pc(b)}</div>`).join('')}<span class="stamp" style="color:${v.verdict=='BUY'?'#39ff88':'#ff3b6b'}">${v.verdict=='BUY'?'APPROVED':'REJECTED'}</span> <small>${E(v.verdict)}</small>${v.objection?`<div><small>⚠ ${E(v.objection)}</small></div>`:''}</div>`).join('')+`<div class="dp"><h4>🛡 CAPITAL PROTECTED</h4><div class="big">${E(x.blocked_count??0)}</div><small>TITAN-მა დაბლოკა (veto)</small></div>`}
 if(a.r=='chief'){const ds=x.decisions||[];return `<div class="dp" style="grid-column:span 2"><h4>FINAL DECISION · საბოლოო გადაწყვეტილება</h4>${ds.map(q=>`<div class="drow"><span><b>${E(q.candidate)}</b> → ${E(q.action)}</span><b>$${f(+q.size_usd||0)}</b></div>`).join('')||'—'}</div><div class="dp"><h4>DESK P&L დღეს</h4><div class="big ${cls(+x.desk_pl_today||0)}">${x.desk_pl_today==null?'—':'$'+f(+x.desk_pl_today)}</div><small>შესრულებული: ${ds.filter(q=>/buy|sell|exec/i.test(q.action||'')).length}</small></div>`}
 return WAIT()}
function debate(d){if(!d||!d.skeptic)return '<small>⏳ waiting for first desk cycle (23:50) · ველოდებით პირველ ციკლს</small>';const ch={};((d.chief||{}).decisions||[]).forEach(q=>ch[q.candidate]=q);
 return (d.skeptic.reviews||[]).map(v=>{const q=ch[v.candidate];return `<div class="e" style="border-color:${v.verdict=='BUY'?'#39ff88':'#ff9a1f'}"><b style="color:#3fa9ff">ATLAS ▸ შეთავაზება:</b> ${E(v.candidate)} · <b style="color:#ff9a1f">TITAN ▸ წინააღმდეგობა:</b> ${E(v.objection||'—')} · <b style="color:#ffd75e">NOVA ▸ ვერდიქტი:</b> ${E(v.verdict)}${q?` → ${E(q.action)} $${f(+q.size_usd||0)}`:''}</div>`}).join('')}
function renderDesk(){const d=dk(),a=AG[DT],el=document.getElementById('desk');if(!el)return;
 el.innerHTML=`<div class="dh"><b>// სავაჭრო მაგიდა · TRADING DESK</b><span class="blk">🛡 TITAN-მა დაბლოკა: ${d&&d.skeptic?E(d.skeptic.blocked_count??0):0}</span></div>
 <div class="dstage" style="--ac:${a.c}"><canvas id="dcv" width="320" height="150"></canvas><div class="dtitle">${a.k} <span style="color:#fff">${a.ka}</span><br><small>${a.en}</small></div><div class="plate">${a.k}</div></div><div class="dpanel" style="--ac:${a.c}">${panel(a,d)}</div>
 <div class="dtabs">${AG.map((g,i)=>`<button style="--tc:${g.c}" class="${i==DT?'on':''}" onclick="DT=${i};DP=true;renderDesk()">${g.k}</button>`).join('')}</div>
 <div class="dlog"><h4>// დებატების ლოგი (proposal → TITAN objection → verdict) ${DP?'· ⏸':''}</h4>${debate(d)}</div>`}
setInterval(()=>{if(!DP){DT=(DT+1)%6;renderDesk()}},8000);
function drawDesk(){const c=document.getElementById('dcv');if(c){const g=c.getContext('2d'),A=AG[DT].c,t=DF++;g.imageSmoothingEnabled=false;
 const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,w|0,h|0)};
 R(0,0,320,150,'#0a0e24');
 // windows with city
 for(const wx of [0,262]){R(wx,0,58,96,'#0d1640');for(let b=0;b<6;b++){const bh=30+((b*37+wx)%45),bx=wx+b*10;R(bx,96-bh,9,bh,'#141c3c');for(let yy=96-bh+3;yy<94;yy+=5)for(let xx=bx+2;xx<bx+8;xx+=3)if(((xx*7+yy*13+((t>>5)*(b+1)))%9)<3)R(xx,yy,1,2,'#ffd27a')}R(wx,0,58,2,'#1e2a5c');for(let k=0;k<4;k++)R(wx+k*19,0,2,96,'#1e2a5c')}
 R(58,0,204,96,'#0b1030');for(let y=0;y<96;y+=8)R(58,y,204,1,'#0e1438');
 // plants
 for(const px_ of [6,292]){R(px_+6,98,12,14,'#3a2a1a');for(let k=0;k<7;k++)R(px_+k*3,84+((k*5)%9),3,14-((k*5)%9),k%2?'#1f7a3a':'#2a9a48')}
 // monitors
 const mons=[[22,92,50,30],[78,88,48,32],[132,82,56,36],[194,88,48,32],[248,92,50,30]];
 mons.forEach(([x,y,w,h],i)=>{R(x-2,y-2,w+4,h+4,'#1a1f3a');R(x,y,w,h,'#020611');g.globalAlpha=.25;R(x,y,w,h,A);g.globalAlpha=1;
  if(i%2==0){let py=y+h/2;g.fillStyle=A;for(let k=0;k<w-4;k++){py+=Math.sin((k+t*.5+i*20)*.3)*1.2;py=Math.max(y+2,Math.min(y+h-3,py));g.fillRect(x+2+k,py|0,1,1)}}
  else{for(let k=0;k<w-6;k+=4){const hh=4+((k*3+t*.3+i*11)|0)%(h-8);R(x+3+k,y+h-2-hh,2,hh,(k/4)%3?'#39ff88':'#ff3b6b')}}
  R(x,y+((t*.6+i*9)%h),w,1,'rgba(255,255,255,.25)');R(x+w/2-3,y+h+2,6,4,'#1a1f3a')});
 // desk
 R(0,122,320,6,'#2a2440');R(0,128,320,22,'#15122a');for(let x=10;x<320;x+=60){R(x,132,40,7,'#1e1a36');R(x+16,135,8,1,'#ffb84a')}
 R(110,120,30,4,'#2c3150');R(184,120,30,4,'#2c3150');R(60,116,8,6,'#e8e0d0');
 // character seated, from behind
 const b=Math.sin(t*.08)>0?0:1,HD='#0b0d1a',HL='#1c2140';
 R(118,104+b,84,34,'#121735');R(124,100+b,72,8,'#182048');R(128,98+b,64,4,'#1e2756');R(158,100+b,4,30,'#0c1028');R(140,108+b,2,20,HL);R(178,108+b,2,20,HL);
 R(150,92+b,20,8,'#2a2030');
 R(142,62+b,36,32,HD);R(138,68+b,44,22,HD);R(140,58+b,40,6,HD);
 for(let k=0;k<9;k++)R(136+k*5,54+b-((k*3)%5),6,8,HD);
 R(144,64+b,6,3,HL);R(160,60+b,8,2,HL);R(168,66+b,5,3,HL);
 R(140,56+b,40,4,'#2a2f45');R(132,70+b,8,16,'#2a2f45');R(180,70+b,8,16,'#2a2f45');R(134,74+b,3,8,A);R(183,74+b,3,8,A);
 R(126,126,68,24,'#0d1024');R(122,120,8,30,'#151a35');R(190,120,8,30,'#151a35');
 // lamp glow
 g.globalAlpha=.5+.3*Math.sin(t*.1);R(56,40,4,8,'#ffcf6b');R(260,40,4,8,'#ffcf6b');g.globalAlpha=1}
 requestAnimationFrame(drawDesk)}
requestAnimationFrame(drawDesk);

render();poll();setInterval(poll,30000);
